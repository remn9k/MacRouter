name: Build & Release macOS Menu Bar App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-app:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Swift Version
        run: swift --version

      - name: Build and Package macOS App
        run: |
          chmod +x mac-app/scripts/package.sh
          ./mac-app/scripts/package.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mac-app/9Router-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
